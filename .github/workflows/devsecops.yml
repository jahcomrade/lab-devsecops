name: DevSecOps-Full-Auto-Lokal
on: [push]

jobs:
  security-scan:
    name: 🛡️ Escaneo y Carga Automática
    runs-on: [self-hosted, seguridad]
    env:
      DOJO_URL: "http://localhost:8080"
      DOJO_TOKEN: "b3829da6a0e52e5a999123354864cfcd7ffeb9f7" # <--- PEGA TU TOKEN AQUÍ AA
      PRODUCT_NAME: "Laboratorio-ASUS"

    steps:
      - name: 📂 Clonar Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Ejecutar Semgrep (SAST)
        shell: powershell
        run: |
          semgrep scan --config="p/default" --sarif --output=semgrep.sarif
        continue-on-error: true

      - name: 📦 Ejecutar Trivy (SCA)
        shell: powershell
        run: |
          trivy fs --format json --output trivy-results.json .
        continue-on-error: true

      - name: 🛡️ Ejecutar Gitleaks (Secrets)
        shell: powershell
        run: |
          gitleaks detect --report-format sarif --report-path gitleaks-report.sarif
        continue-on-error: true

      - name: 🚀 Sincronizar con DefectDojo
        shell: powershell
        run: |
          # Configuramos la codificación para evitar errores de caracteres en Windows
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          function Upload-Report($file, $type) {
              if (Test-Path $file) {
                  Write-Host "Subiendo $type..."
                  # Añadimos 'product_type_name' para que Dojo pueda crear el producto si no existe
                  curl.exe -X POST "${{ env.DOJO_URL }}/api/v2/import-scan/" `
                  -H "Authorization: Token ${{ env.DOJO_TOKEN }}" `
                  -F "active=true" `
                  -F "verified=true" `
                  -F "scan_type=$type" `
                  -F "product_name=${{ env.PRODUCT_NAME }}" `
                  -F "product_type_name=Research and Development" `
                  -F "engagement_name=Escaneo-Automatico" `
                  -F "auto_create_context=true" `
                  -F "file=@$file"
              } else {
                  Write-Warning "Archivo $file no encontrado."
              }
          }

          Upload-Report "trivy-results.json" "Trivy Scan"
          Upload-Report "gitleaks-report.sarif" "Gitleaks Scan"
          # Semgrep falló en tu log, así que es probable que este archivo no exista aún
          Upload-Report "semgrep.sarif" "SARIF"