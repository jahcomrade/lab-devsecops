name: DevSecOps Pipeline

# Esto le dice al pipeline que se ejecute cada vez que subas código a la rama 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  # 1. Detección de Secretos
  scan-leaks:
    name: Deteccion de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que Gitleaks lea todo el historial
      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Análisis Estático (SAST)
  scan-sast:
    name: Analisis de Codigo (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Ejecutar Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default" # Usa las reglas por defecto para múltiples lenguajes

  # 3. Análisis de Dependencias (SCA)
  scan-sca:
    name: Analisis de Dependencias (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Ejecutar Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          # Ponemos 0 para que nos muestre el error pero no rompa el pipeline en nuestro primer intento
          exit-code: '0' 
          ignore-unfixed: true
          vuln-type: 'library'