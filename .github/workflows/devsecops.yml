name: DevSecOps-Full-Auto-Lokal
on: [push]

jobs:
  security-scan:
    name: 🛡️ Escaneo y Carga Automática
    runs-on: [self-hosted, seguridad]
    env:
      DOJO_URL: "http://localhost:8080"
      DOJO_TOKEN: "b3829da6a0e52e5a999123354864cfcd7ffeb9f7" # <--- PEGA TU TOKEN AQUÍ 2
      PRODUCT_NAME: ${{ github.repository }}

    steps:
      - name: 📂 Clonar Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Ejecutar Semgrep (SAST)
        shell: powershell
        run: |
          $env:PYTHONUTF8=1
          semgrep scan --config="p/default" --sarif --output=semgrep.sarif --error
        continue-on-error: true

      - name: 📦 Ejecutar Trivy (SCA)
        shell: powershell
        run: |
          # Este comando sube TODO a Dojo (lo que ya tienes)
          trivy fs --format json --output trivy-results.json .
          
          
          trivy fs --exit-code 1 --severity HIGH,CRITICAL .
        continue-on-error: true # <--- Aquí SÍ queremos que falle

      - name: 🛡️ Ejecutar Gitleaks (Secrets)
        shell: powershell
        run: |
          gitleaks detect --report-format sarif --report-path gitleaks-report.sarif
        continue-on-error: true

      - name: 🚀 Sincronizar con DefectDojo
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          function Upload-Report($file, $type) {
              if (Test-Path $file) {
                  Write-Host "Esperando 5 segundos para sincronizar $type..."
                  Start-Sleep -s 5
                  
                  # Ejecutamos todo en una sola línea para evitar errores de sintaxis en PowerShell
                  curl.exe -X POST "${{ env.DOJO_URL }}/api/v2/import-scan/" -H "Authorization: Token ${{ env.DOJO_TOKEN }}" -F "active=true" -F "verified=true" -F "scan_type=$type" -F "product_name=${{ env.PRODUCT_NAME }}" -F "product_type_name=Research and Development" -F "engagement_name=CI-CD-Pipeline" -F "auto_create_context=true" -F "close_old_findings=true" -F "file=@$file"
              } else {
                  Write-Warning "Archivo $file no encontrado, saltando..."
              }
          }

          # Subimos en orden
          Upload-Report "trivy-results.json" "Trivy Scan"
          Upload-Report "gitleaks-report.sarif" "SARIF"
          Upload-Report "semgrep.sarif" "SARIF"

      - name: ⚖️ Verificación del Umbral Crítico
        shell: powershell
        run: |
          # Esperamos un poco para que Dojo termine de procesar la subida
          Start-Sleep -s 10 
          
          $DojoUrl = "${{ env.DOJO_URL }}/api/v2/findings/?test__engagement__product__name=${{ env.PRODUCT_NAME }}&active=true&verified=true&severity=High,Critical"
          
          $response = curl.exe -X GET $DojoUrl -H "Authorization: Token ${{ env.DOJO_TOKEN }}" -H "Accept: application/json"
          $data = $response | ConvertFrom-Json

          Write-Host "Vulnerabilidades Reales (Activas y Verificadas): $($data.count)"

          if ($data.count -gt 0) {
              Write-Error "❌ BLOQUEADO: Hay $($data.count) vulnerabilidades Críticas/Altas en Dojo."
              exit 1
          } else {
              Write-Host "✅ LIMPIO: No hay riesgos pendientes en Dojo. Merge permitido."
          }