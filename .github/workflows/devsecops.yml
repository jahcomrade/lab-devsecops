name: Lab-Estricto
on: [push]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo-Leaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escaneo-SAST-OWASP
        uses: returntocorp/semgrep-action@v1
        with:
          # CAMBIO AQUÍ: Usamos 'p/default' que incluye OWASP y es más estable
          config: "p/default" 

      - name: Escaneo-SCA-Librerias
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
